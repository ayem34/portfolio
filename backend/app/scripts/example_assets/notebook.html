<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Notebook d'exemple</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f1612; }
      pre { background: #f4ece6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
      .out { border-left: 3px solid #c2410c; padding-left: 1rem; }
    </style>
  </head>
  <body>
    <h1>Notebook d'exemple (données fictives)</h1>
    <p>Ce fichier montre à quoi ressemble un notebook publié. Remplacez-le par le vôtre, exporté avec <code>jupyter nbconvert --to html</code>.</p>
    <pre>avis = ["très bon", "décevant", "correct", "excellent"]
scores = [0.9, 0.2, 0.5, 0.95]</pre>
    <div class="out">
      <p>Sortie : score moyen = 0,64</p>
      <svg viewBox="0 0 320 140" role="img" aria-label="Scores fictifs par avis" width="320">
        <g fill="#c2410c">
          <rect x="20" y="22" width="50" height="108" /><rect x="95" y="106" width="50" height="24" />
          <rect x="170" y="70" width="50" height="60" /><rect x="245" y="16" width="50" height="114" />
        </g>
        <line x1="10" y1="130" x2="310" y2="130" stroke="#1f1612" />
      </svg>
    </div>
  </body>
</html>
